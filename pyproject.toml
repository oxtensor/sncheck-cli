[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sncheck"
version = "0.1.0"
description = "CLI security scanner for checking Bittensor subnet repositories before miners run them."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "SNCheck contributors" }
]
keywords = ["bittensor", "security", "scanner", "subnet", "miner"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[project.urls]
Homepage = "https://github.com/sncheck/sncheck-cli"
Repository = "https://github.com/sncheck/sncheck-cli"

[project.scripts]
sncheck = "sncheck.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["sncheck"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
